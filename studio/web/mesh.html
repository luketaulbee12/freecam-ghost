<!doctype html><html><head><meta charset="utf-8"><title>Mesh viewer</title>
<style>html,body{margin:0;height:100%;background:#20242b}canvas{display:block}#l{position:absolute;left:8px;top:8px;color:#fff;font:13px system-ui}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><div id="l"></div><script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
const f = new URLSearchParams(location.search).get('f');
document.getElementById('l').textContent = f;
const r = new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.2)); const d = new THREE.DirectionalLight(0xffffff, 1.5); d.position.set(2,3,4); s.add(d);
const c = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.01, 100); const o = new OrbitControls(c, r.domElement);
function add(obj){ const rx = +(new URLSearchParams(location.search).get('rx')||0), rz = +(new URLSearchParams(location.search).get('rz')||0); obj.rotation.set(rx*Math.PI/180, 0, rz*Math.PI/180); obj.updateMatrixWorld(true); const b = new THREE.Box3().setFromObject(obj); const ctr = b.getCenter(new THREE.Vector3()); const sz = b.getSize(new THREE.Vector3()).length();
  obj.position.sub(ctr); s.add(obj); c.position.set(0, sz*0.25, sz*1.3); o.target.set(0,0,0); o.update(); window.ready = true; }
if (f.endsWith('.glb')) new GLTFLoader().load('/meshes/'+f, g => { g.scene.traverse(m => { if (m.isMesh) { m.geometry.computeVertexNormals(); if (!new URLSearchParams(location.search).get('tex')) m.material = new THREE.MeshStandardMaterial({color:0xd8d2c4}); else if (m.material.map) { m.material = new THREE.MeshBasicMaterial({map: m.material.map}); } } }); add(g.scene); });
else new PLYLoader().load('/meshes/'+f, g => { g.computeVertexNormals(); add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({vertexColors: g.hasAttribute('color')}))); });
window.view = (x,y,z) => { const L = c.position.length(); c.position.set(x,y,z).setLength(L); o.update(); };
(function loop(){ requestAnimationFrame(loop); r.render(s,c); })();
</script></body></html>
